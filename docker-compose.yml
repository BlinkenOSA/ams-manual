services:
  manual:
    build:
      context: .
      dockerfile: Dockerfile
    image: ams-manual:latest
    restart: unless-stopped
    ports:
      - "${AMS_MANUAL_BIND_ADDRESS:-127.0.0.1}:${AMS_MANUAL_PORT:-8080}:80"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    security_opt:
      - no-new-privileges:true
